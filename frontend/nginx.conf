server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 必须显式放开：nginx 默认 client_max_body_size 只有 1m，
    # 而后端 MAX_UPLOAD_SIZE 是 20MB（app/config.py）。不设这一项的话，
    # 超过 1MB 的照片 / 报名表会在 nginx 层直接 413，请求根本到不了 FastAPI，
    # 后端那句「文件大小超过限制（20MB）」永远执行不到，前端也只会拿到
    # nginx 的 HTML 错误页而不是统一 JSON 信封。手机照片普遍 3-8MB，必踩。
    # 留 5MB 余量给 multipart 边界与编码开销。
    client_max_body_size 25m;

    # 前端静态资源（SPA history 路由 fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 FastAPI
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：proxy_read_timeout 默认只有 60 秒。
        # 单次 Kimi 推理模型调用实测就在 140 秒上下（thinking tokens 很慢），
        # JD 解析、简历诊断这类仍是同步的 AI 接口会稳定吃到 504。
        # 生成简历 / 面试准备已改后台任务，这里的值只是给同步接口兜底。
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 健康检查与文档直通
    location /health {
        proxy_pass http://app:8000;
        proxy_read_timeout 10s;
    }
}
